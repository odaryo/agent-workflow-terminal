name: tmp-475-step-timeout
# Issue #475 の計測用。PR を作る前に消す。
on:
  push:
    branches: [ci/step-timeouts]
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: a (hang past its step timeout)
        id: a
        timeout-minutes: 1
        run: |
          date -u +%FT%TZ
          sleep 180
          echo "a: sleep finished (should not print)"
      - name: b (not cancelled)
        if: ${{ !cancelled() }}
        run: |
          date -u +%FT%TZ
          echo "b ran: a.outcome=${{ steps.a.outcome }} a.conclusion=${{ steps.a.conclusion }} job.status=${{ job.status }}"
      - name: c (failure)
        if: ${{ failure() }}
        run: echo "c ran: failure() was true"
      - name: d (default condition)
        run: echo "d ran: default success() was true"
      - name: e (always)
        if: ${{ always() }}
        run: echo "e ran: always()"
