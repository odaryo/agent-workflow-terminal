# SwiftLint 設定
#
# 方針: 既定ルール + 軽い調整のみ。書式(インデント・改行・空白)は swift-format が担当し、
# SwiftLint は「設計上まずい書き方」の検出に寄せる。
# 詳細は docs/coding-guidelines.md を参照。

included:
  - AgentWorkflowTerminal/Sources
  - AgentWorkflowTerminal/Tests

excluded:
  # スパイクは使い捨てコードであり、規約の対象外 (docs/coding-guidelines.md)。
  - Spikes
  - AgentWorkflowTerminal/.build
  - .build

# 書式系 (trailing_comma / opening_brace) は swift-format と責務が重なるため無効化する。
disabled_rules:
  - trailing_comma
  - opening_brace
  # CLI 出力のパーサでは非失敗デコード (`String(decoding:_:as:)`) が意図的な方針
  # (docs/coding-guidelines.md §2.3)。また `TmuxListPanes.splitEncodedFields` の入力は
  # Data ではなく String 由来の `[UInt8]` で不正 UTF-8 になり得ず、失敗し得る
  # `String(bytes:encoding:)` へ置き換えると到達不能なエラー経路が増えるだけ (誤検知)。
  - optional_data_string_conversion

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - empty_count
  - empty_string
  - first_where
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition

# タスクは GitHub Issues が single source of truth (CLAUDE.md)。
# TODO/FIXME コメントはコードに置かず、Issue にしてから消す。
todo:
  severity: error

# コード行の 100 桁上限は swift-format (`lineLength: 100`) が CI で担保する
# (コメント行は swift-format の行長検査の対象外)。
# ここは保険の上限だけ置き、コメントと URL は対象外にする。
line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# 設計書由来の名前(§12 の状態名など)を短縮しないため、識別子長は緩める。
identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

type_name:
  min_length:
    warning: 3

# ファイル分割の強制はしない。長くなったら設計で割る。
file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 400
  error: 600

nesting:
  type_level: 2

# docs/coding-guidelines.md §1.1 / §2.3 の禁止事項のうち swift-format で担保できないもの。
# 例外 (C API 境界) は理由コメント + `swiftlint:disable:next` で行単位に局所化する。
# 注意: custom_rules はコメント中の文字列にも一致する。誤検知はその行だけ disable する。
custom_rules:
  no_fatal_error:
    name: "fatalError"
    regex: '\bfatalError\s*\('
    message: "fatalError は使わない (docs/coding-guidelines.md §2.3)"
    severity: error
  no_unchecked_sendable:
    name: "unchecked Sendable"
    regex: '@unchecked\s+Sendable'
    message: "@unchecked Sendable は原則禁止 (docs/coding-guidelines.md §1.1)"
    severity: error
  no_nonisolated_unsafe:
    name: "nonisolated(unsafe)"
    regex: 'nonisolated\(unsafe\)'
    message: "nonisolated(unsafe) は原則禁止 (docs/coding-guidelines.md §1.1)"
    severity: error

reporter: xcode
