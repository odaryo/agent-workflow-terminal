name: CI

# Spikes/ は使い捨てコードであり CI 対象外 (docs/coding-guidelines.md §6)。
# ビルド対象にも lint 対象にも含めず、Spikes/ だけの変更ではジョブを起動しない。
# docs/ と *.md も、どのジョブも読まないので起動しない (Issue #473)。`**.md` はどの階層の .md にも
# 一致するので、テストの Fixtures などジョブが読む場所に .md を置くなら、このパターンを狭めること。
# .claude/settings.json は shell guard の検査対象なので外さない。
#
# scripts/wf-pr-merge.sh がこの2つのリストを scripts/ci_paths_ignored.py で読み、CI の起動しない
# PR の待ちを省いている。判定器は1行の flow sequence で、push と pull_request が同じリストの
# ときだけ読める。pull_request の run はマージコミット (PR head + main) の ci.yml で起動を決めるので、
# wf-pr-merge.sh は PR head と main の両方の ci.yml で判定し、どちらかが読めなければ待ちを省かない。
on:
  push:
    branches: [main]
    paths-ignore: ["Spikes/**", "docs/**", "**.md"]
  pull_request:
    paths-ignore: ["Spikes/**", "docs/**", "**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# macOS runner の同時実行数はアカウント全体で 5 で、並行する PR と main の push がそれを取り合う。
# ジョブを 8 つに分けていた頃は、run が1本でも 3 ジョブが空き待ちになり、重なった回は最初の
# ジョブが始まるまでに 84 秒待った (実測 2026-11-01、Issue #472)。ジョブを増やすと待ちが
# そのまま総時間に乗るので、検査を足すときは既存のジョブへ段として足す。
#
# 空き待ちが起きたときに一番長いジョブが後回しにならないよう、クリティカルパスの
# build-and-test を先頭に置く。
jobs:
  # 単体テストと、実 tmux / git / ripgrep を起動する統合テスト。同じパッケージを2つのジョブで
  # ビルドしていた (各 77〜96 秒) のを1回にまとめている。
  build-and-test:
    name: Build & Test (SwiftPM, unit + integration)
    runs-on: macos-15
    # 段ごとの上限は 600 + 300 (単体) + 600 + 300 (統合) = 1800s。CI 実測 (run 41304065113) の
    # 固定費は setup+checkout+toolchain 約 10s / brew 14s / build 69s、wrapper の停止処理は 17s
    # (run 34245198762)。
    # 固定費を 420s、停止処理を 4 本分 240s まで見積もっても 2460s = 41 分で、45 分に届かない。
    # 4 本ともハングした回でも、どれも exit 124 とスタックを書き終えてから job が終わる。
    timeout-minutes: 45
    defaults:
      run:
        working-directory: AgentWorkflowTerminal
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        id: build
        run: swift build --build-tests

      # 経過時間とプロセス全体の CPU を測る AdaptersSerialTimingTests は、同一プロセス内で
      # 並行実行されると他テストの負荷を観測してしまうため分けて走らせる。
      #
      # run-swift-test.sh を挟むのは、job の timeout-minutes ではハングを cancel でしか
      # 止められず、ログも成果物も残らないため (実測: run 34231972322 は 19 分無言のまま
      # cancel され、どのテストで止まったか特定できなかった)。
      #
      # 単体テストは tmux / ripgrep を導入する前に走らせる。統合テスト用のフラグ無しで実 CLI に
      # 触れてしまうテストを、CLI の無い環境で落とすため (ジョブを分けていた頃と同じ前提)。
      - name: Test
        run: |
          "$GITHUB_WORKSPACE/scripts/run-swift-test.sh" \
            --log "$RUNNER_TEMP/test-logs/build-and-test.log" \
            --timeout 600 \
            -- swift test --skip AdaptersSerialTimingTests

      # 以降の段は、前の段が落ちても build が通っていれば走らせる。ジョブを分けていた頃は
      # 単体テストの失敗と統合テストの結果を別々に得られており、それを失わないため。
      - name: Test (serial, timing sensitive)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/run-swift-test.sh" \
            --log "$RUNNER_TEMP/test-logs/build-and-test-serial.log" \
            --timeout 300 \
            -- swift test --no-parallel --filter AdaptersSerialTimingTests

      # tmux と ripgrep は runner イメージに無い (実測 2026-09-08: macos-15-arm64 の README に
      # どちらも記載が無い)。導入は 13〜19 秒 (実測 2026-11-01)。
      - name: Install tmux and ripgrep
        id: install-clis
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: brew install tmux ripgrep

      # 版数は固定せず runner の既定を使い、ログに残す。サポート下限版数が未決 (Issue #16) の
      # 段階で pin すると、外界のドリフトを検出するというこの段の目的自体が消える。
      - name: Show external CLI versions
        if: ${{ !cancelled() && steps.install-clis.outcome == 'success' }}
        run: |
          tmux -V
          git --version
          rg --version

      # 統合テストを有効にしたまま全体を通す。AdaptersSerialTimingTests を外すのは単体テストと
      # 同じ理由に加え、統合テスト有効時に時間予算を超える既知の問題 (Issue #176) を避けるため。
      # 統合テストは既定の swift test では `.enabled(if:)` で無効になっており、フラグはこの段と
      # 次の段にだけ渡す。
      - name: Test (integration enabled)
        if: ${{ !cancelled() && steps.install-clis.outcome == 'success' }}
        env:
          AWT_TMUX_INTEGRATION: "1"
          AWT_GIT_INTEGRATION: "1"
          AWT_RIPGREP_INTEGRATION: "1"
        run: |
          "$GITHUB_WORKSPACE/scripts/run-swift-test.sh" \
            --log "$RUNNER_TEMP/test-logs/integration-full.log" \
            --timeout 600 \
            -- swift test --skip AdaptersSerialTimingTests

      # 統合 suite だけを走らせた結果で「実際に走ったか」を検査する。環境変数が無いと
      # これらの suite は skip されるが swift test は成功で終わるため、GREEN では判定できない。
      # filter は 12 suite / 99 テスト分を1回で走らせるためのもの。skip を静かに見逃さないよう、
      # 実行後に scripts/check-integration-ran.sh で件数と skip 0 件を検査する。
      - name: Test (integration suites only)
        id: integration-only
        if: ${{ !cancelled() && steps.install-clis.outcome == 'success' }}
        env:
          AWT_TMUX_INTEGRATION: "1"
          AWT_GIT_INTEGRATION: "1"
          AWT_RIPGREP_INTEGRATION: "1"
          AWT_INTEGRATION_FILTER: >-
            TmuxRunnerIntegrationTests|TmuxListPanesIntegrationTests|TmuxPaneOperationsIntegrationTests|TmuxSessionOperationsIntegrationTests|TmuxTextInjectionIntegrationTests|TmuxWorktreePaneSourceIntegrationTests|TmuxPaneSummaryIntegrationTests|GitWorktreeDetectorIntegrationTests|GitProjectResolverIntegrationTests|GitFileHistoryIntegrationTests|DiffSnapshotRangeIntegrationTests|RipgrepSearchIntegrationTests
        run: |
          "$GITHUB_WORKSPACE/scripts/run-swift-test.sh" \
            --log "$RUNNER_TEMP/test-logs/integration-only.log" \
            --timeout 300 \
            -- swift test --filter "$AWT_INTEGRATION_FILTER"

      - name: Verify integration suites actually ran
        if: ${{ !cancelled() && steps.integration-only.outcome != 'skipped' }}
        run: |
          "$GITHUB_WORKSPACE/scripts/check-integration-ran.sh" \
            --log "$RUNNER_TEMP/test-logs/integration-only.log" \
            --min-tests 99 \
            --suites 12

      # テストが落ちた回ほど後始末の状態を知りたいので、失敗しても走らせる。always() では
      # ないのは、concurrency の cancel-in-progress で途中で殺された回にも走ってしまい、
      # 中断による残存を後始末漏れとして赤くするため (always() は cancel でも実行される)。
      - name: Check for leftover servers and sockets
        if: ${{ !cancelled() }}
        run: "$GITHUB_WORKSPACE/scripts/check-integration-leftovers.sh"

      # 成否にかかわらず保存する。条件付きにすると、書き間違えたときに一番必要な回のログが
      # 消える (762 件中 1 件だけ落ちた回を 2 度取り逃している: Issue #272)。
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-build-and-test
          path: ${{ runner.temp }}/test-logs/
          # ビルド段階で落ちるとログが1件も無い。ここで二重に失敗させても情報は増えない。
          if-no-files-found: warn

  build-app:
    name: Build (macOS App)
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Fetch GhosttyKit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-ghostty.sh

      - name: Build
        working-directory: App
        run: swift build

      # UI 層は unit test の対象外 (docs/coding-guidelines.md) だが、libghostty の設定
      # 読み込み経路だけは window も GHOSTTY_RESOURCES_DIR も無しに検証できる (Issue #236)。
      - name: Test
        working-directory: App
        run: swift test

  # 互いに独立した短い検査をまとめたジョブ。各段は `!cancelled()` で走らせ、1つが落ちても
  # 残りの段の結果を得る (ジョブを分けていた頃と同じく、全部の結果を1回の run で見るため)。
  # どれかの段が落ちればジョブは失敗する。
  checks:
    name: Static checks & iOS build
    runs-on: macos-15
    # SwiftLint / shellcheck が runner イメージから外れると brew で導入するため (数分)、
    # 段の合計 (実測 2 分前後) より大きく取る。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
          git --version
          bash --version | head -1

      # swift-format は Swift 6 toolchain 同梱のため追加インストール不要
      # (docs/coding-guidelines.md §7)。
      - name: swift-format
        if: ${{ !cancelled() }}
        run: |
          swift format lint \
            --configuration .swift-format \
            --recursive --strict \
            AgentWorkflowTerminal/Sources \
            AgentWorkflowTerminal/Tests \
            AgentWorkflowTerminal/Package.swift \
            App/Sources \
            App/Tests \
            App/Package.swift

      # SwiftLint はランナーイメージに同梱されていればそれを使い、
      # 同梱が外れた場合だけ brew で導入する (数分かかる)。
      - name: SwiftLint
        if: ${{ !cancelled() }}
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint lint --config .swiftlint.yml --strict

      # 以下の shell guard の段は、PreToolUse (Bash) フックの判定本体を fixture で検査する。
      # フックは Claude Code の設定から呼ばれるだけでリポジトリのビルドには関与しないため、
      # 壊れても他の段は緑のまま通る (Issue #314)。
      #
      # runner は macOS にする。フックが実運用で動くのは開発者の macOS なので、
      # 同じ python3 / bash で fixture を回さないと、環境差が CI をすり抜ける。
      #
      # shellcheck はランナーイメージに同梱されていればそれを使い、外れた場合だけ導入する
      # (SwiftLint の段と同じ方針)。
      - name: Install shellcheck if missing
        if: ${{ !cancelled() }}
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi
          shellcheck --version | sed -n '2p'

      # SC1091 は lib.sh を source する既存スクリプトが一律に出す info で、
      # 静的解析からは追跡できないパスを指す (各スクリプト先頭の注釈のとおり)。
      - name: ShellCheck
        if: ${{ !cancelled() }}
        run: shellcheck -e SC1091 scripts/*.sh

      # 判定本体に構文エラーがあると python3 自身が exit 1 を返し、フックは block しない
      # (= 素通り) 側へ落ちる。コンパイルだけは必ず通っていることを別段で確かめる。
      - name: Shell guard - compile
        if: ${{ !cancelled() }}
        run: |
          python3 -m py_compile scripts/guard_bash_tmux.py
          python3 -m py_compile scripts/tests/tmux-kill-guard/make-perf-command.py

      - name: Shell guard - fixtures
        if: ${{ !cancelled() }}
        run: scripts/check-tmux-kill-guard.sh

      # wf-pr-merge.sh は、この判定器が「CI は起動しない」と返した PR の待ちを省く。誤って
      # そう返すと CI 未検証のままマージされるため、判定の向きを fixture と変異で固定する。
      - name: CI paths-ignore detector - fixtures
        if: ${{ !cancelled() }}
        run: |
          python3 -m py_compile scripts/ci_paths_ignored.py
          scripts/check-ci-paths-ignored.sh

      # session 名が正しいかは 2 段に分かれる。**規則** (安定 ID → 名前) が Swift の TmuxSessionName と
      # 一致することと、**規則へ渡す安定 ID の取り方** (worktree → 管理ディレクトリ) が git と一致する
      # こと。どちらがずれても wf-worktree-remove.sh は残骸を見落とすか別の session を指す (Issue #343)。
      # 前者は静的な一覧で、後者は実際に組み立てた git リポジトリ群で検査する。
      #
      # Build & Test に入れないのは、落ちたときに「どちらの実装が壊れたか」ではなく
      # 「両者がずれた」ことだけを示す段にしたいため。TerminalCore しかビルドしない。
      - name: Session name parity - naming rule (bash vs Swift)
        if: ${{ !cancelled() }}
        run: scripts/check-session-name-parity.sh

      - name: Session name parity - stable ID (worktree admin dir)
        if: ${{ !cancelled() }}
        run: scripts/check-worktree-admin-dir.sh

      - name: Build (iOS Simulator)
        if: ${{ !cancelled() }}
        working-directory: AgentWorkflowTerminal
        run: |
          swift build \
            --triple arm64-apple-ios17.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
